name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.14'

    - name: Install PyTorch CPU and backend dependencies
      run: |
        python -m pip install --upgrade pip
        pip install torch==2.11.0+cpu --index-url https://download.pytorch.org/whl/cpu
        cd backend
        pip install -r requirements.txt
        pip install -r requirements-dev.txt

    - name: Run backend tests (excluding slow)
      run: |
        python -m pytest backend/tests -m "not slow" -v

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install frontend dependencies and build
      run: |
        cd frontend
        npm ci
        npm run build
